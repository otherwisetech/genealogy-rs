[package]
name = "gen-app"
description = "Fast desktop explorer and editor for GEDCOM family trees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "genealogy-rs"
path = "src/main.rs"

[dependencies]
i18n.workspace = true
gedcom.workspace = true
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
# map tab: OSM tiles + Nominatim over HTTPS (rustls/ring, no OpenSSL)
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# build.rs embeds the .exe icon; only pulled in when building on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
