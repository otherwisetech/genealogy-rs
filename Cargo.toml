[workspace]
resolver = "2"
members = ["crates/i18n", "crates/gedcom", "crates/mcp", "crates/gen-app"]
default-members = ["crates/i18n", "crates/gedcom", "crates/mcp"]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/otherwisetech/genealogy-rs"

[workspace.dependencies]
gedcom = { path = "crates/gedcom", package = "gen-gedcom" }
i18n = { path = "crates/i18n", package = "gen-i18n" }
genmcp = { path = "crates/mcp", package = "gen-mcp" }
anyhow = "1"
thiserror = "2"
# deep links, app discovery, the shared entity registry and the Today feed of Otherwise apps
otherwise-link = { git = "https://github.com/otherwisetech/otherwise-link", tag = "v0.3.0" }
# the family design system: tokens (Inter, type scale, colours) and the shared chrome (MIT/Apache)
otherwise-ui = { git = "https://github.com/otherwisetech/otherwise-ui", tag = "v0.1.2" }
# GPUI stack, same as the upstream gpui-component examples. Git deps move: Cargo.lock pins revs.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[profile.dev]
opt-level = 1
# GPUI with debuginfo is ~10 GB of target/; keep it lean
debug = 0
[profile.dev.package.gen-gedcom]
debug = 2
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
